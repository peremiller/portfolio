<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" font-family="Montserrat, sans-serif">
  <defs>
    <radialGradient id="sky" cx="32%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#1a4450"/>
      <stop offset="55%" stop-color="#0b1c22"/>
      <stop offset="100%" stop-color="#05090b"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fb6c4"/>
      <stop offset="100%" stop-color="#f0b25e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0b25e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0b25e" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- background -->
  <rect width="800" height="1200" fill="url(#sky)"/>

  <!-- distant city skyline -->
  <g fill="#0e2a32">
    <rect x="40" y="760" width="60" height="200"/>
    <rect x="110" y="700" width="44" height="260"/>
    <rect x="162" y="800" width="70" height="160"/>
    <rect x="560" y="720" width="50" height="240"/>
    <rect x="618" y="780" width="64" height="180"/>
    <rect x="690" y="690" width="46" height="270"/>
  </g>
  <!-- city window lights -->
  <g fill="#f0b25e" opacity="0.5">
    <rect x="58" y="790" width="6" height="6"/><rect x="76" y="820" width="6" height="6"/>
    <rect x="122" y="730" width="6" height="6"/><rect x="138" y="770" width="6" height="6"/>
    <rect x="636" y="810" width="6" height="6"/><rect x="660" y="850" width="6" height="6"/>
    <rect x="702" y="720" width="6" height="6"/><rect x="718" y="760" width="6" height="6"/>
  </g>
  <rect x="0" y="900" width="800" height="160" fill="url(#glow)"/>

  <!-- the wall of sticky notes, faint, behind the figure -->
  <g opacity="0.22">
    <g fill="#d9c98a">
      <rect x="250" y="320" width="34" height="34" transform="rotate(-3 267 337)"/>
      <rect x="300" y="312" width="34" height="34" transform="rotate(2 317 329)"/>
      <rect x="352" y="322" width="34" height="34" transform="rotate(-2 369 339)"/>
      <rect x="404" y="316" width="34" height="34" transform="rotate(3 421 333)"/>
      <rect x="456" y="324" width="34" height="34" transform="rotate(-3 473 341)"/>
      <rect x="508" y="318" width="34" height="34" transform="rotate(2 525 335)"/>
      <rect x="262" y="372" width="34" height="34" transform="rotate(2 279 389)"/>
      <rect x="314" y="378" width="34" height="34" transform="rotate(-2 331 395)"/>
      <rect x="366" y="370" width="34" height="34" transform="rotate(3 383 387)"/>
      <rect x="418" y="376" width="34" height="34" transform="rotate(-3 435 393)"/>
      <rect x="470" y="372" width="34" height="34" transform="rotate(2 487 389)"/>
    </g>
  </g>

  <!-- lone figure, small against the system -->
  <g fill="#020607">
    <ellipse cx="400" cy="930" rx="70" ry="14" opacity="0.6"/>
    <path d="M400 560
             c-26 0 -40 18 -42 44
             l-10 150 c-1 16 8 22 18 22
             l8 0 6 150 c1 10 8 12 14 12
             l12 0 c6 0 9 -4 9 -12
             l0 -150 14 0 0 150 c0 8 3 12 9 12
             l12 0 c6 0 13 -2 14 -12
             l6 -150 8 0 c10 0 19 -6 18 -22
             l-10 -150 c-2 -26 -16 -44 -42 -44 z"/>
    <circle cx="400" cy="528" r="30"/>
  </g>
  <!-- rim light on the figure (warm) -->
  <path d="M358 604 l-10 150 c-1 9 3 14 9 16" fill="none" stroke="#f0b25e" stroke-width="3" opacity="0.5" filter="url(#soft)"/>
  <circle cx="384" cy="520" r="30" fill="none" stroke="#5fb6c4" stroke-width="2" opacity="0.4" filter="url(#soft)"/>

  <!-- the one bright note in the figure's hand -->
  <g transform="rotate(-6 430 700)">
    <rect x="402" y="676" width="56" height="48" fill="#e9d98f"/>
    <text x="430" y="705" fill="#2a2410" font-size="13" font-family="monospace" text-anchor="middle">08:47</text>
  </g>

  <!-- kicker -->
  <text x="400" y="1000" fill="#5fb6c4" font-size="20" letter-spacing="11" text-anchor="middle">A SCI-FI ROMANTIC COMEDY</text>

  <!-- title -->
  <text x="400" y="1085" fill="url(#title)" font-size="104" font-weight="700" letter-spacing="2" text-anchor="middle">OFF-MENU</text>

  <!-- korean motif / tagline -->
  <text x="400" y="1125" fill="#9fb6bb" font-size="19" font-style="italic" text-anchor="middle">잘못된 주문 — the bravest thing you can do is make a mistake</text>

  <!-- top metadata -->
  <text x="400" y="120" fill="#bfe0e6" font-size="16" letter-spacing="5" text-anchor="middle" opacity="0.8">CONTINUITY HAS PREDICTED YOUR DAY</text>
  <line x1="300" y1="140" x2="500" y2="140" stroke="#2f5a63" stroke-width="1"/>
</svg>
